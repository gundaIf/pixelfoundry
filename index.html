<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PixelFoundry — Private Online Image Editor</title>
  <meta name="description" content="120+ image tools in your browser: resize, compress, crop, EXIF, effects, filters, QR, OCR, GIF, collage. Nothing is uploaded." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='%23ffd166'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='%2306d6a0'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='%23ff5d8f'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-tools" title="Tools">☰</button>
      <div class="brand">
        <span class="logo"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">Pixel<b>Foundry</b></span>
      </div>
      <button class="search-trigger" id="btn-search"><span>Search tools…</span><kbd>⌘K</kbd></button>
      <div class="top-actions">
        <button class="btn" id="btn-open" title="Open image (⌘O)">Open</button>
        <div class="btn-group">
          <button class="icon-btn" id="btn-undo" title="Undo (⌘Z)">↶</button>
          <button class="icon-btn" id="btn-redo" title="Redo (⇧⌘Z)">↷</button>
        </div>
        <button class="btn hide-sm" id="btn-gallery" title="Effects gallery (G)">✨ Gallery</button>
        <button class="icon-btn" id="btn-theme" title="Light / dark">◐</button>
        <button class="icon-btn hide-sm" id="btn-help" title="Shortcuts (?)">?</button>
        <button class="btn primary" id="btn-export" title="Export (⌘S)">Export</button>
        <button class="icon-btn only-mobile" id="btn-panel" title="Panel">⚙</button>
      </div>
    </header>

    <aside class="sidebar left">
      <div class="search-box">
        <input id="search" type="search" placeholder="Filter tools…" autocomplete="off" spellcheck="false" />
      </div>
      <nav id="tool-list"></nav>
    </aside>

    <main id="stage">
      <div id="viewport">
        <div id="canvas-wrap" hidden>
          <canvas id="view"></canvas>
          <div id="overlay"></div>
          <div id="split" hidden><span>◀ ▶</span></div>
        </div>
        <section id="empty">
          <div class="drop">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
            </div>
            <h1>Drop, paste or open an image</h1>
            <p class="muted"><b id="tool-count">120</b> tools · live preview · editable steps · batch export. <br />🔒 100% private — your images never leave this device.</p>
            <div class="row center wrap">
              <button class="btn primary big" id="empty-open">Choose image</button>
              <button class="btn big" id="empty-sample">Try a sample</button>
              <button class="btn big" id="empty-new">Create new…</button>
            </div>
            <p class="muted small">JPEG · PNG · WebP · AVIF · GIF · BMP · SVG · HEIC (Safari) — or press <kbd>⌘V</kbd> to paste a screenshot</p>
          </div>
          <h4 class="feat-title">Popular tools</h4>
          <div id="featured"></div>
        </section>
      </div>
      <div id="busy" hidden><i class="spinner"></i><span>Working…</span></div>
      <footer id="status">
        <span class="dims"></span>
        <span class="pixel"></span>
        <span class="spacer"></span>
        <select id="preview-quality" title="Preview resolution (exports are always full resolution)">
          <option value="1024">Preview: fast</option>
          <option value="1600">Preview: balanced</option>
          <option value="2600">Preview: sharp</option>
          <option value="99999">Preview: full res</option>
        </select>
        <button class="chip-btn" id="btn-hold" title="Hold to see before (or hold \)">Hold: before</button>
        <button class="chip-btn" id="btn-compare" title="Before/after split (C)">Split</button>
        <div class="zoom">
          <button class="chip-btn" id="zoom-out">−</button>
          <button class="chip-btn" id="zoom-label" title="Zoom">100%</button>
          <button class="chip-btn" id="zoom-in">+</button>
          <button class="chip-btn" id="zoom-fit" title="Fit (F)">Fit</button>
          <button class="chip-btn" id="zoom-100" title="Actual size (1)">1:1</button>
        </div>
      </footer>
    </main>

    <aside class="sidebar right">
      <canvas id="hist" width="300" height="70" title="Histogram"></canvas>
      <div class="tabs">
        <button data-tab="tool" class="on">Tool</button>
        <button data-tab="steps">Steps <span id="steps-count" class="badge" hidden></span></button>
        <button data-tab="export">Export</button>
      </div>
      <div class="panel" id="panel-tool"></div>
      <div class="panel" id="panel-steps" hidden></div>
      <div class="panel" id="panel-export" hidden></div>
    </aside>
  </div>
  <div id="scrim"></div>
  <div id="drop-hint"><div>Drop to open</div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
